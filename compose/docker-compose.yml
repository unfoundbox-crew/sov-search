services:
  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    networks:
      - sov

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:?set SEARXNG_SECRET}
      - SEARXNG_VALKEY_URL=redis://valkey:6379/0
      - BIND_ADDRESS=0.0.0.0:8080
      - UWSGI_WORKERS=4
      - UWSGI_THREADS=4
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - ./limiter.toml:/etc/searxng/limiter.toml:ro
    depends_on:
      - valkey
    networks:
      - sov
    deploy:
      replicas: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8888:8888"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - searxng
    networks:
      - sov

  # Optional Tor sidecar for .onion engines. Off by default.
  # Enable with: docker compose --profile tor up -d
  tor:
    image: dperson/torproxy:latest
    restart: unless-stopped
    ports:
      - "9050:9050"
    networks:
      - sov
    profiles:
      - tor

networks:
  sov:
    driver: bridge
